profiles:
  default:
    fqbn: arduino:zephyr:unoq
    platforms:
      - platform: arduino:zephyr
    compiler_flags:
      ld_flags:
        - "-lm"
      cpp_flags:
        - "-DDEBUG"
        - "-DDEBUGLOG_DEFAULT_LOG_LEVEL_TRACE"
        - "-DARDUINO_ZEPHYR_LOG_LEVEL=4"
    libraries:
      - MsgPack (0.4.2)
      - DebugLog (0.8.4)
      - ArxContainer (0.7.0)
      - ArxTypeTraits (0.3.1)
      - Servo (1.3.0)
      - Ultrasonic (3.0.0)

default_profile: default
